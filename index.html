<style>
:root{--bg:#060714;--tx:#f4f5ff;--mut:#9aa0c7;--g1:#7c5cff;--g2:#ff7a45;--g3:#19d3c5;--bad:#ff5d73;--ok:#25d366;--gl:rgba(255,255,255,.055);--gb:rgba(255,255,255,.11);--grad:linear-gradient(135deg,var(--g1),var(--g2));--hw:#fff;--st:rgba(255,255,255,.04);--bo:28%;--b1:#7c5cff;--b2:#ff7a45;--lbg:transparent;--lp:0px;--r:22px;--sh:none;--ff:Cairo,Tahoma,system-ui,sans-serif;--bgi:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(55vmax 55vmax at 0% 0%,color-mix(in srgb,var(--b1) var(--bo),transparent),transparent),radial-gradient(55vmax 55vmax at 100% 100%,color-mix(in srgb,var(--b2) var(--bo),transparent),transparent),var(--bgi)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--gb);position:sticky;top:0;z-index:5}
.logo{font-weight:900;font-size:20px;cursor:pointer;display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;background:var(--grad);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px -4px rgba(255,122,69,.7)}
.logo span{background:linear-gradient(90deg,var(--hw),var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:8px;align-items:center}
.ib{background:var(--gl);border:1px solid var(--gb);color:var(--tx);border-radius:12px;padding:8px 12px;cursor:pointer;font:inherit;font-size:15px;position:relative;transition:.2s}
.ib:hover{background:var(--gb)}
.badge{color:#fff;position:absolute;top:-8px;inset-inline-start:-8px;background:var(--grad);border-radius:50%;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center;font-weight:800}
main{padding:14px 14px 90px;max-width:1100px;margin:auto}
h2{margin:8px 0 12px}
input,select,textarea{width:100%;background:var(--gl);border:1px solid var(--gb);color:var(--tx);padding:12px 14px;border-radius:14px;font:inherit;margin-bottom:10px;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
select option{background:var(--bg);color:var(--tx)}
label{font-size:13px;color:var(--mut);display:block;margin:2px 4px 4px}
.hero{text-align:center;padding:30px 6px 18px}
.hero h1{font-size:clamp(28px,7vw,54px);margin:0 0 8px;font-weight:900;line-height:1.25;background:linear-gradient(90deg,var(--hw),var(--g1),var(--g2),var(--hw));background-size:220%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 7s linear infinite}
@keyframes sh{to{background-position:220%}}
.hero p{color:var(--mut);margin:0 0 20px;font-size:16px}
.sb{max-width:520px;margin:auto}
.sb input{padding:15px 20px;border-radius:30px;margin:0;background:rgba(255,255,255,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 18px;border-radius:30px;background:var(--gl);border:1px solid var(--gb);color:var(--tx);cursor:pointer;font:inherit;font-size:14px;transition:.2s}
.chip.on{color:#fff;background:var(--grad);border-color:transparent;font-weight:800;box-shadow:0 6px 16px -6px rgba(255,122,69,.8)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--gl);border:1px solid var(--gb);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s;animation:up .5s both;animation-delay:var(--d)}
.pc:hover{transform:translateY(-6px);box-shadow:0 18px 40px -12px rgba(124,92,255,.55);border-color:rgba(124,92,255,.6)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.pi{position:relative;margin:8px;border-radius:16px;background:radial-gradient(circle at 50% 40%,#fff,#e6e9f6);aspect-ratio:1;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.pi img{width:100%;height:100%;object-fit:contain;transition:.4s}
.pc:hover .pi img{transform:scale(1.08)}
.ph{font-size:60px}
.dis{position:absolute;top:8px;inset-inline-start:8px;background:linear-gradient(135deg,#ff3d6e,#ff7a45);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:20px;z-index:1}
.cd{position:absolute;bottom:8px;inset-inline-end:8px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff;z-index:1}
.cd.new{background:#1fb86a}.cd.used{background:#8a6df2}.cd.imp{background:#0aa5c2}
.pb{padding:4px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.ct{font-size:11px;color:var(--g3);font-weight:700}
.pb h3{margin:0;font-size:15px;cursor:pointer;line-height:1.4}
.prs{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}
.pr{font-size:19px;font-weight:900;background:linear-gradient(90deg,var(--g2),var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.old{color:var(--mut);font-size:13px;text-decoration:line-through}
.btn{border:1px solid var(--gb);background:var(--gl);color:var(--tx);padding:11px 14px;border-radius:14px;cursor:pointer;font:inherit;font-weight:700;transition:.2s}
.btn:active{transform:scale(.97)}
.btn.fill,.btn.on{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 8px 20px -8px rgba(255,122,69,.7)}
.btn.wab{background:var(--ok);border-color:transparent;color:#fff}
.btn.red{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.pp{display:grid;gap:18px}
@media(min-width:760px){.pp{grid-template-columns:1fr 1fr;align-items:start}}
.big{position:relative;border-radius:var(--r);background:radial-gradient(circle at 50% 40%,#fff,#e6e9f6);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 60px -10px rgba(124,92,255,.55)}
.big img{width:100%;height:100%;object-fit:contain}
.pinfo h1{margin:6px 0;font-size:27px;line-height:1.3}
.pbox{background:var(--gl);border:1px solid var(--gb);border-radius:20px;padding:14px;margin:12px 0}
.nowp{font-size:34px;font-weight:900;background:linear-gradient(90deg,var(--g2),var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sv{display:inline-block;background:rgba(31,184,106,.15);color:#3be08c;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700}
.spec{border-radius:16px;overflow:hidden;border:1px solid var(--gb);margin-bottom:14px}
.sr{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--gb);align-items:center}
.sr:before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--grad)}
.sr:nth-child(odd){background:var(--st)}
.sr:last-child{border-bottom:0}
.sr span{color:var(--mut);flex:0 0 36%;font-size:14px}
.sr b{font-weight:600;flex:1}
.mut{color:var(--mut)}
.ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);z-index:20;display:flex;justify-content:flex-end}
.dr{background:var(--bg);width:min(420px,100%);height:100%;overflow:auto;padding:16px;border-inline-start:1px solid var(--gb)}
.ci{display:flex;gap:10px;align-items:center;background:var(--gl);border:1px solid var(--gb);border-radius:16px;padding:10px;margin-bottom:8px}
.ci img,.ci .ph{width:54px;height:54px;object-fit:contain;background:#fff;border-radius:10px;font-size:30px;display:grid;place-items:center}
.ci>div{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs .btn{white-space:nowrap}
.box{background:var(--gl);border:1px solid var(--gb);border-radius:min(var(--r),22px);box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat div{background:var(--gl);border:1px solid var(--gb);border-radius:16px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#tt{color:#fff;position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--grad);padding:10px 20px;border-radius:24px;font-weight:800;z-index:30;box-shadow:0 10px 30px -8px #000;opacity:0;pointer-events:none;transition:.25s}#tt.on{opacity:1;transform:translateX(-50%)}
.wa{position:fixed;bottom:18px;inset-inline-start:16px;width:58px;height:58px;border-radius:50%;background:var(--ok);display:grid;place-items:center;font-size:28px;text-decoration:none;box-shadow:0 6px 20px rgba(37,211,102,.5);z-index:6;animation:pl 2.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 12px rgba(37,211,102,0)}}
.sk{height:270px;border-radius:var(--r);background:linear-gradient(100deg,var(--gl) 30%,rgba(255,255,255,.12) 50%,var(--gl) 70%);background-size:200%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200%}}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}

function qty(id,d){const c=cart.find(x=>x.id==id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);const v=["cn","cp","ca"].map(i=>$(i)?$(i).value:"");render();["cn","cp","ca"].forEach((i,k)=>{if($(i))$(i).value=v[k]});updBadge()}
const cartTotal=()=>cart.reduce((a,c)=>{const p=findP(c.id);return a+(p?p.price*c.q:0)},0);
function cartView(){if(!cartOpen)return"";
 const items=cart.map(c=>{const p=findP(c.id);if(!p)return"";return `<div class="ci">${imgOf(p)}<div><b>${esc(p.name)}</b><div class="mut">${money(p.price)}</div></div><button class="ib" onclick="qty('${p.id}',-1)">−</button><b>${c.q}</b><button class="ib" onclick="qty('${p.id}',1)">+</button></div>`}).join("");
 return `<div class="ov" onclick="if(event.target==this){cartOpen=false;render()}"><div class="dr"><div class="row" style="justify-content:space-between"><h2>🛒 ${t("cart")}</h2><button class="ib" onclick="cartOpen=false;render()">✕</button></div>
 ${cart.length?items+`<h3>${t("total")}: <span class="pr">${money(cartTotal())}</span></h3><input id="cn" placeholder="${t("name")}"><input id="cp" placeholder="${t("phone")}" type="tel"><textarea id="ca" rows="2" placeholder="${t("addr")}"></textarea><button class="btn fill" style="width:100%" onclick="checkout()">${t("order")}</button>`:`<p class="mut">${t("empty")}</p>`}</div></div>`}
async function checkout(){const n=$("cn").value.trim(),ph=$("cp").value.trim(),a=$("ca").value.trim();if(!n||!ph||!a){alert(t("need"));return}if(ordering)return;ordering=true;
 const items=cart.map(c=>{const p=findP(c.id);if(!p)return null;const sp=pspec(p);return {name:p.name,price:p.price,q:c.q,code:String(p.no||p.code||""),sp:SK.map(k=>sp[k[0]]).filter(Boolean).join(" | ")}}).filter(Boolean);
 const o={ts:Date.now(),ref:String(Date.now()).slice(-6),date:new Date().toLocaleString(),name:n,phone:ph,addr:a,items,total:cartTotal(),status:"pend"};
 tgSend(tgText(o));
 if(ST.wa){const msg=`🛒 ${ST.store} - طلب جديد #${o.ref}\n━━━━━━━━━━━━\n👤 الاسم: ${n}\n📞 الرقم: ${ph}\n📍 العنوان: ${a}\n━━━━━━━━━━━━\n${items.map(i=>`• ${i.name} #${i.code} x${i.q} = ${i.price*i.q} ${ST.cur}`).join("\n")}\n━━━━━━━━━━━━\n💵 ${t("total")}: ${o.total} ${ST.cur}`;window.open(`https://wa.me/${waNum(ST.wa)}?text=${encodeURIComponent(msg)}`,"_blank")}
 let ok=true;try{await Promise.race([setDoc(doc(db,"orders","o"+o.ts),o),new Promise(r=>setTimeout(r,6000))])}catch(e){ok=false;console.error(e)}
 ordering=false;if(!ok&&!ST.wa){alert(t("orderfail"));return}
 cart=[];cartOpen=false;render();toast("✓ "+t("ordered"))}

function loginView(){return `<h2>${t("admin")}</h2><input id="lu" type="email" placeholder="Email" autocapitalize="none"><input id="pw" type="password" placeholder="${t("pass")}" onkeydown="if(event.key=='Enter')doLogin()">${err?`<p style="color:var(--bad)">${err}</p>`:""}<button class="btn fill" onclick="doLogin()">${t("login")}</button>`}
async function doLogin(){try{await signIn(auth,$("lu").value.trim(),$("pw").value);err=""}catch(e){err=t("bad");render()}}
function logout(){signOutF(auth);go("/")}

function admin(){if(!me)return loginView();
 const tabs=[["p",t("prods")],["o",t("orders")],["d",t("design")],["s",t("sett")]].map(x=>`<button class="btn ${tab==x[0]?"on":""}" onclick="tab='${x[0]}';edit=null;render()">${x[1]}</button>`).join("");
 const rev=O.filter(o=>o.status!="canc").reduce((a,o)=>a+o.total,0);let body="";
 if(tab=="p"){const act=P.filter(p=>!p.archived),arc=P.filter(p=>p.archived);
  const sub=`<div class="tabs"><button class="btn ${pv=="a"?"on":""}" onclick="pv='a';render()">${t("prods")} (${act.length})</button><button class="btn ${pv=="x"?"on":""}" onclick="pv='x';render()">🗄️ ${t("archv")} (${arc.length})</button></div>`;
  if(edit)body=pform();
  else if(pv=="a")body=sub+`<div class="row" style="flex-wrap:wrap"><button class="btn fill" onclick="edit={id:'',name:'',cat:'',oldPrice:'',price:'',cond:'imp',specs:[''],img:''};render()">+ ${t("newp")}</button>${P.some(p=>!p.no)?`<button class="btn" onclick="numberOld()">🔢 ${t("numold")} (${P.filter(p=>!p.no).length})</button>`:""}${P.length?"":`<button class="btn" onclick="loadSample()">${t("sample")}</button>`}</div><br>`+act.map(rowA).join("");
  else body=sub+(arc.length?arc.map(rowX).join(""):`<p class="mut">${t("noarch")}</p>`)}
 if(tab=="o")body=O.length?O.map(o=>`<div class="box"><div class="row" style="justify-content:space-between"><b>${esc(o.name)}</b><span class="mut" style="font-size:12px">${esc(o.date)}</span></div><div>📞 <a style="color:var(--g3)" href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div><div class="mut">📍 ${esc(o.addr)}</div><div style="margin:6px 0">${(o.items||[]).map(i=>`• ${esc(i.name)} ${i.code?"#"+esc(i.code):""} ×${i.q}`).join("<br>")}</div><b class="pr">${money(o.total)}</b>
 <div class="row" style="margin-top:8px"><select style="margin:0" onchange="setSt('${o.id}',this.value)">${["pend","ship","fin","canc"].map(s=>`<option value="${s}" ${o.status==s?"selected":""}>${t(s)}</option>`).join("")}</select><button class="btn sm red" onclick="delO('${o.id}')">${t("del")}</button></div></div>`).join(""):`<p class="mut">${t("noo")}</p>`;
 if(tab=="d")body=designView();
 if(tab=="s")body=`<label>${t("store")}</label><input id="s1" value="${esc(ST.store)}"><label>${t("tag")}</label><input id="s4" value="${esc(ST.tag)}"><label>${t("logo")}</label><div class="row" style="margin-bottom:10px"><div class="lgp" style="padding:calc(var(--lp)*1.5) calc(var(--lp)*3)"><img src="${logoSrc()}" style="height:48px"></div><input type="file" accept="image/*" onchange="upLogo(this)" style="margin:0"></div><button class="btn sm" style="margin-bottom:12px" onclick="saveCfg({logo:''})">${t("logoreset")}</button><label>${t("wa")}</label><input id="s2" value="${esc(ST.wa)}" inputmode="numeric" placeholder="201012345678"><label>${t("cur")}</label><input id="s3" value="${esc(ST.cur)}"><button class="btn fill" onclick="saveSet()">${t("save")}</button>${tgCard()}`;
 return `<div class="row" style="justify-content:space-between"><h2>${t("admin")}</h2><button class="btn sm" onclick="logout()">${t("out")}</button></div><p class="mut" style="margin:0 0 10px;font-size:13px">${esc(me)}</p><div class="stat"><div><b>${P.filter(p=>!p.archived).length}</b>${t("cnt")}</div><div><b>${O.length}</b>${t("cnto")}</div><div><b>${rev.toLocaleString("en")}</b>${t("rev")}</div></div><div class="tabs">${tabs}</div>${body}`}
function editP(id){const p=P.find(x=>x.id==id),ps=pspec(p);edit={...p,cpu:ps.cpu,ram:ps.ram,ssd:ps.ssd,vga:ps.vga,specs:ps.rest.length?ps.rest:[""],cond:p.cond||"imp",oldPrice:p.oldPrice||""};render()}
function pform(){const e=edit;return `<div class="box"><label>${t("name")}</label><input id="f1" value="${esc(e.name)}">
<label>${t("cat")}</label><input id="f6" placeholder="${t("catph")}" value="${esc(e.cat)}">${CATS.length?`<div class="chips" style="padding-top:0">${CATS.map((c,i)=>`<button class="chip" onclick="$('f6').value=CATS[${i}]">${esc(c)}</button>`).join("")}</div>`:""}
<label>${t("oldp")}</label><input id="f7" type="number" inputmode="decimal" value="${esc(e.oldPrice)}"><label>${t("price")}</label><input id="f2" type="number" inputmode="decimal" value="${esc(e.price)}">
<label>${t("code")}</label><div class="pbox" style="margin:0 0 10px;padding:10px;font-weight:800">${e.no?"#"+e.no:t("autocode")}</div><label>${t("cond")}</label><select id="f4">${["new","used","imp"].map(c=>`<option value="${c}" ${(e.cond||"imp")==c?"selected":""}>${t(c)}</option>`).join("")}</select>
<label>${t("specs")}</label><div class="sp4" style="margin-top:4px">${SK.map(a=>`<div class="st" style="gap:6px;text-align:start"><div class="row"><i style="width:64px;height:44px;border-radius:10px;padding:3px">${ICO[a[0]]}</i><b style="font-size:14px">${a[2]}</b></div><input id="sk_${a[0]}" value="${esc(e[a[0]])}" placeholder="${t(a[0]+"ph")}" style="margin:0"></div>`).join("")}</div><label>${t("extra")}</label>${e.specs.map((l,i)=>`<div class="row" style="margin-bottom:8px"><input class="spi" value="${esc(l)}" placeholder="${t("specph")}" style="margin:0"><button class="btn sm red" onclick="rmLine(${i})">✕</button></div>`).join("")}<button class="btn sm" style="margin-bottom:14px" onclick="addLine()">+ ${t("addline")}</button>
<label>${t("img")}</label><input type="file" accept="image/*" onchange="upImg(this)"><div class="big pv">${imgOf(e)}</div>
<div class="row"><button class="btn fill" onclick="saveP()">${t("save")}</button><button class="btn" onclick="edit=null;render()">${t("bk")}</button></div></div>`}
function grab(){edit.name=$("f1").value;edit.cat=$("f6").value;edit.oldPrice=$("f7").value;edit.price=$("f2").value;edit.cond=$("f4").value;edit.specs=[...document.querySelectorAll(".spi")].map(x=>x.value);SK.forEach(a=>{const el=$("sk_"+a[0]);if(el)edit[a[0]]=el.value})}
function addLine(){grab();edit.specs.push("");render();const a=document.querySelectorAll(".spi");a[a.length-1].focus()}
function rmLine(i){grab();edit.specs.splice(i,1);if(!edit.specs.length)edit.specs=[""];render()}
async function upImg(inp){
 const f=inp.files[0];if(!f)return;grab();toast("⏳ "+t("imgwait"));
 const fail=m=>{inp.value="";alert(m||t("imgfail"))};
 const draw=async mode=>{let src,w,h,rel=()=>{};
  if(mode=="bmp"){src=await createImageBitmap(f);w=src.width;h=src.height;rel=()=>{try{src.close()}catch(e){}}}
  else{const u=URL.createObjectURL(f),im=new Image();im.src=u;await im.decode();src=im;w=im.naturalWidth;h=im.naturalHeight;rel=()=>URL.revokeObjectURL(u)}
  const pvEl=document.querySelector(".pv"),boxW=pvEl?pvEl.getBoundingClientRect().width:0,T=Math.max(400,Math.min(900,Math.round((boxW||360)*Math.min(window.devicePixelRatio||1,2)))),k=T/Math.max(w,h),c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);rel();return c};
 const blank=c=>{const d=c.getContext("2d").getImageData(0,0,c.width,c.height).data;for(let i=0;i<d.length;i+=4)if(d[i]<250||d[i+1]<250||d[i+2]<250)return false;return true};
 try{let c=null;
  for(const m of ["img","bmp"]){try{const k=await draw(m);if(!blank(k)){c=k;break}}catch(e){console.error(m,e)}}
  if(!c)return fail(t("imgblank"));
  let q=.85,du=c.toDataURL("image/jpeg",q);while(du.length>700000&&q>.4){q-=.1;du=c.toDataURL("image/jpeg",q)}edit.img=du;render();toast("✓ "+t("imgok")+" ("+Math.round(edit.img.length/1024)+"KB)")
 }catch(e){console.error(e);fail()}}
async function saveP(){grab();if(!edit.name||!edit.price||saving)return;saving=true;const id=edit.id||"p"+Date.now();
 try{if(!edit.no)edit.no=await nextCode();
  const d={name:edit.name.trim(),cat:edit.cat.trim(),price:Number(edit.price),oldPrice:Number(edit.oldPrice)||0,no:edit.no,code:String(edit.no),cond:edit.cond,cpu:(edit.cpu||"").trim(),ram:(edit.ram||"").trim(),ssd:(edit.ssd||"").trim(),vga:(edit.vga||"").trim(),specs:edit.specs.map(x=>x.trim()).filter(Boolean),img:edit.img||"",ts:edit.ts||Date.now()};
  await setDoc(doc(db,"products",id),d);edit=null;render()}catch(e){alert("Error: "+(e.code||"")+" "+(e.message||e))}
 saving=false}
const rowA=p=>`<div class="ci">${imgOf(p)}<div><b>${esc(p.name)}</b><div class="mut" style="font-size:13px"><b>#${esc(p.no||p.code||"-")}</b> · ${p.cat?esc(p.cat)+" · ":""}${t(p.cond||"imp")}</div><div>${money(p.price)} ${pct(p)?`<span class="old">${money(p.oldPrice)}</span> <span class="sv">-${pct(p)}%</span>`:""}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="editP('${p.id}')">${t("edit")}</button><button class="btn sm red" onclick="archP('${p.id}',true)">🗄️ ${t("arch")}</button></div></div>`;
const rowX=p=>`<div class="ci" style="opacity:.88">${imgOf(p)}<div><b>${esc(p.name)}</b><div>${money(p.price)}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm fill" onclick="archP('${p.id}',false)">♻️ ${t("restore")}</button><button class="btn sm red" onclick="purgeP('${p.id}')">${t("purge")}</button></div></div>`;
async function archP(id,v){try{await updateDoc(doc(db,"products",id),{archived:v});toast("✓ "+t(v?"archdone":"restdone"))}catch(e){alert(e.code||e.message)}}
async function purgeP(id){if(confirm(t("conf")))try{await deleteDoc(doc(db,"products",id))}catch(e){alert(e.code||e.message)}}
function designView(){const cur=ST.theme||"masr",th=TH.find(x=>x.id==cur)||TH[0];
 return `<h3>${t("themes")} (${TH.length})</h3><div class="thg">${TH.map(x=>{const v=x.v;return `<div class="th ${x.id==cur?"on":""}" style="background:${v.bg};background-image:${v.bgi};color:${v.tx};border-radius:${v.r}" onclick="pickTheme('${x.id}')"><div class="bar" style="background:linear-gradient(135deg,${v.g1},${v.g2})"></div><div class="mini"><i style="background:${v.g1}"></i><i style="background:${v.g2}"></i><i style="background:${v.g3}"></i></div><div style="font-family:${v.ff},Cairo;font-weight:800;margin-top:6px">${lang=="ar"?x.ar:x.en}</div></div>`}).join("")}</div>
 <div class="box" style="margin-top:14px"><h3 style="margin-top:0">${t("custom")}</h3><div class="row"><div style="flex:1"><label>${t("c1")}</label><input type="color" id="cc1" value="${ST.c1||th.v.g1}" style="height:46px;padding:4px"></div><div style="flex:1"><label>${t("c2")}</label><input type="color" id="cc2" value="${ST.c2||th.v.g2}" style="height:46px;padding:4px"></div></div><div class="row"><button class="btn fill" onclick="setCustom()">${t("save")}</button><button class="btn" onclick="resetCustom()">${t("reset")}</button></div></div>`}
async function saveCfg(o){Object.assign(ST,o);render();try{await setDoc(doc(db,"settings","main"),o,{merge:true});toast("✓ "+t("saved"))}catch(e){alert(e.code||e.message)}}
function upLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);saveCfg({logo:c.toDataURL("image/png")})};im.src=r.result};r.readAsDataURL(f)}
const pickTheme=id=>saveCfg({theme:id,c1:"",c2:""});
const setCustom=()=>saveCfg({c1:$("cc1").value,c2:$("cc2").value});
const resetCustom=()=>saveCfg({c1:"",c2:""});
async function loadSample(){try{const s=[["Dell Precision 5550",30000,25000,"Workstation",["المعالج: Core i7 الجيل العاشر","الرام: 32GB","التخزين: 512GB SSD","الشاشة: 15.6 inch 4K"]],["Dell Precision 7550",28000,23000,"Workstation",["المعالج: Core i7 الجيل العاشر","الرام: 32GB","كارت الشاشة: Quadro T2000"]],["Dell Precision 7670",52000,45000,"Workstation",["المعالج: Core i9 الجيل 12","الرام: 64GB","كارت الشاشة: RTX A3000"]]];
 for(let i=0;i<s.length;i++){const n=await nextCode();await setDoc(doc(db,"products","s"+i),{name:s[i][0],oldPrice:s[i][1],price:s[i][2],cat:s[i][3],specs:s[i][4],no:n,code:String(n),cond:"imp",img:"",ts:Date.now()+i})}}catch(e){alert("Error: "+(e.code||"")+" "+(e.message||e))}}
async function setSt(id,s){try{await updateDoc(doc(db,"orders",id),{status:s})}catch(e){alert(e.code||e.message)}}
async function delO(id){if(confirm(t("conf")))try{await deleteDoc(doc(db,"orders",id))}catch(e){alert(e.code||e.message)}}
async function saveSet(){try{await setDoc(doc(db,"settings","main"),{store:$("s1").value.trim(),tag:$("s4").value.trim(),wa:$("s2").value.replace(/\D/g,""),cur:$("s3").value.trim()||"EGP"},{merge:true});toast("✓ "+t("saved"))}catch(e){alert(e.code||e.message)}}

function render(keep){
 applyTheme();document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";document.title=ST.store||"Store";
 CATS=[...new Set(P.filter(p=>!p.archived).map(p=>p.cat).filter(Boolean))];
 const r=route();let m;if(r.startsWith("/p/"))m=prod(r.slice(3));else if(r=="/admin")m=admin();else m=home();
 const pos=keep&&$("qs")?$("qs").selectionStart:null;
 $("app").innerHTML=header()+`<main>${m}</main>`+cartView()+(ST.wa?`<a class="wa" href="https://wa.me/${esc(waNum(ST.wa))}" target="_blank" rel="noopener">💬</a>`:"");
 if(pos!==null){const i=$("qs");i.focus();i.setSelectionRange(pos,pos)}}
(()=>{let tm,taps=[];const d=document,cb=e=>e.target&&e.target.closest&&e.target.closest("#cartbtn");
d.addEventListener("pointerdown",e=>{if(!cb(e))return;clearTimeout(tm);tm=setTimeout(()=>{window.__lp=1;try{navigator.vibrate&&navigator.vibrate(60)}catch(x){}go("/admin")},3000)});
["pointerup","pointercancel"].forEach(n=>d.addEventListener(n,()=>{clearTimeout(tm);if(window.__lp)setTimeout(()=>{window.__lp=0},600)}));
d.addEventListener("pointerout",e=>{if(cb(e)&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest("#cartbtn")))clearTimeout(tm)});
d.addEventListener("contextmenu",e=>{if(cb(e))e.preventDefault()});
d.addEventListener("click",e=>{if(!(e.target.closest&&e.target.closest(".logo")))return;const n=Date.now();taps=taps.filter(x=>n-x<4000);taps.push(n);if(taps.length>=7){taps=[];go("/admin")}});
})();
render();init();
</script></body></html>
